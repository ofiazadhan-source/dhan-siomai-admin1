<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHAN SIOMAI POS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {
  background: linear-gradient(135deg, #FFF8E1 0%, #FFE0B2 100%);
  min-height:100vh;
}
.header {
  background: linear-gradient(135deg, #D32F2F, #B71C1C);
  color:white;
  padding:20px 15px;
  text-align:center;
  box-shadow:0 4px 12px rgba(211,47,47,0.3);
}
.header h1 {
  font-size:24px;
  font-weight:700;
  margin-bottom:5px;
}
.header p {
  font-size:14px;
  opacity:0.9;
}
.container {
  max-width:600px;
  margin:0 auto;
  padding:30px 20px;
}
.menu-grid {
  display:grid;
  gap:15px;
  grid-template-columns:1fr 1fr;
}
.menu-card {
  background:white;
  border-radius:16px;
  padding:25px 20px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
  text-decoration:none;
  color:#333;
  transition:0.2s;
}
.menu-card:active {
  transform:scale(0.95);
}
.menu-card .icon {
  font-size:40px;
  margin-bottom:10px;
}
.menu-card h3 {
  font-size:16px;
  font-weight:700;
  margin-bottom:5px;
  color:#D32F2F;
}
.menu-card p {
  font-size:12px;
  color:#666;
}
.menu-card.pos {
  background:linear-gradient(135deg, #D32F2F, #E57373);
  color:white;
}
.menu-card.pos h3, .menu-card.pos p {
  color:white;
}
.menu-card.profit {
  background:linear-gradient(135deg, #4caf50, #66bb6a);
  color:white;
}
.menu-card.profit h3, .menu-card.profit p {
  color:white;
}
.menu-card.inventory {
  background:linear-gradient(135deg, #FF9800, #FFB74D);
  color:white;
}
.menu-card.inventory h3, .menu-card.inventory p {
  color:white;
}
.footer {
  text-align:center;
  padding:20px;
  color:#666;
  font-size:12px;
}
@media (max-width:400px){
.menu-grid {grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="header">
  <h1>🍢 DHAN SIOMAI</h1>
  <p>Point of Sale System</p>
</div>

<div class="container">
  <div class="menu-grid">
    
    <a href="pos.html" class="menu-card pos">
      <div class="icon">💻</div>
      <h3>POS</h3>
      <p>Magbenta dito</p>
    </a>

    <a href="net-profet.html" class="menu-card profit">
      <div class="icon">💰</div>
      <h3>Net Profit</h3>
      <p>Sales & Expenses</p>
    </a>

    <a href="inventory.html" class="menu-card inventory">
      <div class="icon">📦</div>
      <h3>Inventory</h3>
      <p>Manage Products</p>
    </a>

    <a href="#" class="menu-card" style="opacity:0.5;">
      <div class="icon">📊</div>
      <h3>Reports</h3>
      <p>Coming Soon</p>
    </a>

  </div>
</div>

<div class="footer">
  © 2026 DHAN SIOMAI POS System
</div>
</body>
</html>
