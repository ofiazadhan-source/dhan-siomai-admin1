<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - DHAN SIOMAI Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {background:linear-gradient(135deg, #FFF8E1, #FFE0B2);}
.header { 
  background: linear-gradient(135deg, #D32F2F, #B71C1C); 
  color:white; padding:15px; display:flex; justify-content:space-between; align-items:center; 
  position:sticky; top:0; z-index:10; 
}
.header h1 {font-size:18px; font-weight:700;}
.header a { 
  color:#D32F2F; background:#fff; text-decoration:none; font-weight:600; 
  padding:8px 14px; border-radius:8px; font-size:14px; 
}
.container {padding:20px; max-width:600px; margin:0 auto;}

/* Login Box */
.login-box { 
  background:white; border-radius:16px; padding:25px; 
  box-shadow:0 4px 16px rgba(0,0,0,0.1); margin-top:50px; 
}
.login-box h2 { color:#D32F2F; margin-bottom:15px; text-align:center; }
.login-box input { 
  width:100%; padding:12px; border:2px solid #FFE0B2; 
  border-radius:10px; font-size:15px; margin-bottom:15px; 
}
.login-box button { 
  width:100%; padding:12px; background:#D32F2F; color:white; 
  border:none; border-radius:10px; font-weight:700; font-size:15px; cursor:pointer; 
}
.login-box button:disabled { opacity:0.6; cursor:not-allowed; }
.error-msg { color:#D32F2F; font-size:13px; margin-top:10px; text-align:center; }

/* Settings Content */
.settings-content {display:none;}
.card { 
  background:white; border-radius:16px; padding:20px; margin-bottom:20px; 
  box-shadow:0 4px 16px rgba(0,0,0,0.08); 
}
.card h3 { color:#D32F2F; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.card p { font-size:13px; color:#666; margin-bottom:15px; }
.reset-grid { display:grid; gap:10px; }
.reset-btn { padding:12px; border:none; border-radius:10px; font-weight:600; cursor:pointer; font-size:14px; }
.btn-orange {background:#FFA726; color:white;}
.btn-red {background:#f44336; color:white;}
.btn-red:hover {background:#d32f2f;}
.warning-box { 
  background:#FFF3CD; border-left:4px solid #FFC107; padding:12px; 
  border-radius:8px; font-size:13px; color:#856404; margin-bottom:15px; 
}
.user-info {
  background:#E3F2FD; padding:10px; border-radius:8px; margin-bottom:15px;
  font-size:13px; color:#1565C0;
}
.logout-btn {
  background:#666; color:white; border:none; padding:8px 14px; 
  border-radius:8px; cursor:pointer; font-size:13px;
}
</style>
</head>
<body>

<div class="header">
  <h1>⚙️ Settings</h1>
  <a href="index.html">← Back</a>
</div>

<div class="container">
  <!-- Login Box -->
  <div class="login-box" id="loginBox">
    <h2>🔒 Admin Login</h2>
    <input type="email" id="emailInput" placeholder="Email" autocomplete="email">
    <input type="password" id="passwordInput" placeholder="Password" onkeyup="if(event.key==='Enter') login()">
    <button id="loginBtn" onclick="login()">Login</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- Settings Content -->
  <div class="settings-content" id="settingsContent">
    <div class="user-info">
      <span id="userEmail">Loading...</span>
      <button class="logout-btn" onclick="logout()" style="float:right;">Logout</button>
    </div>

    <div class="warning-box">
      ⚠️ Warning: Reset actions cannot be undone. Make sure you have a backup before proceeding.
    </div>

    <div class="card">
      <h3>🧹 Reset Data</h3>
      <p>Delete specific data from your system. Be careful with this.</p>
      <div class="reset-grid">
        <button class="reset-btn btn-orange" onclick="resetSales()">Reset Sales Only</button>
        <button class="reset-btn btn-orange" onclick="resetExpenses()">Reset Expenses Only</button>
        <button class="reset-btn btn-orange" onclick="resetProducts()">Reset Products Only</button>
        <button class="reset-btn btn-red" onclick="resetAll()">🗑️ Reset ALL Data</button>
      </div>
    </div>

    <div class="card">
      <h3>ℹ️ System Info</h3>
      <p id="systemInfo">Loading...</p>
    </div>
  </div>
</div>

<script type="module">
import { db } from './firebase-config.js';
import { 
  collection, getDocs, doc, writeBatch 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { 
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const auth = getAuth();

// Check if user is already logged in
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('settingsContent').style.display = 'block';
    document.getElementById('userEmail').textContent = user.email;
    loadSystemInfo();
  } else {
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('settingsContent').style.display = 'none';
  }
});

// Login function
window.login = async function() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const btn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMsg');
  
  if (!email || !password) {
    errorMsg.textContent = 'Fill up email and password';
    return;
  }
  
  btn.disabled = true;
  btn.textContent = 'Logging in...';
  errorMsg.textContent = '';
  
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    errorMsg.textContent = '❌ Wrong email or password';
    console.error(error);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Login';
  }
}
  
// Logout function
window.logout = async function() {
  await signOut(auth);
  document.getElementById('emailInput').value = '';
  document.getElementById('passwordInput').value = '';
}

  
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHAN SIOMAI POS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body { background: #f5f5f5; }

/* Login Screen */
#loginScreen {
  position: fixed; top: 0; left: 0; 
  width: 100%; height: 100%; 
  background: url('bg.jpg') center/cover no-repeat; 
  display: flex; justify-content: center; align-items: center; 
  z-index: 10000;
}
#loginScreen::before {
  content: ''; position: absolute; top: 0; left: 0; 
  width: 100%; height: 100%; 
  background: rgba(0,0,0,0.6); z-index: -1;
}
.login-box {
  background: rgba(255,255,255,0.95); padding: 30px; 
  border-radius: 20px; width: 90%; max-width: 350px; 
  text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.login-box h2 { color: #D32F2F; margin-bottom: 20px; font-weight: 700; }
.login-box input {
  width: 100%; padding: 14px; margin-bottom: 12px; 
  border-radius: 10px; border: 2px solid #FFE0B2; font-size: 15px;
}
.login-box input:focus { outline: none; border-color: #D32F2F; }
.login-box button {
  width: 100%; padding: 14px; 
  background: linear-gradient(135deg, #D32F2F, #B71C1C); 
  color: white; border: none; border-radius: 10px; 
  font-weight: 700; font-size: 16px; cursor: pointer;
}
.error-msg { color: #D32F2F; font-size: 13px; margin-top: 10px; display: none; }

/* Dashboard */
#dashboard { display: none; }
.header {
  background: #ff7043; color: white; padding: 15px 20px; 
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 100;
}
.header h2 { font-size: 18px; }
.header button {
  background: white; color: #ff7043; border: none; 
  padding: 8px 15px; border-radius: 6px; font-weight: 700; cursor: pointer;
}
.menu { padding: 15px; padding-bottom: 30px; }
.card {
  background: white; border-radius: 12px; padding: 20px; 
  margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer;
  transition: transform 0.1s;
}
.card:active { transform: scale(0.98); }
.card div { font-size: 40px; text-align: center; margin-bottom: 10px; }
.card h3 { text-align: center; font-size: 18px; margin-bottom: 5px; }
.card p { text-align: center; color: #666; font-size: 14px; }
.badge {
  display: inline-block; background: #ff7043; color: white; 
  padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 8px;
}
.card.danger { 
  border: 2px solid #D32F2F; 
}
.card.danger h3 { color: #D32F2F; }
.loading { color: #999; font-size: 12px; }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen">
  <div class="login-box">
    <h2>🍡 DHAN SIOMAI</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="error-msg" id="errorMsg">Invalid username or password</div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="header">
    <h2>📦 DHAN SIOMAI Admin</h2>
    <button onclick="logout()">Logout</button>
  </div>
  
  <div class="menu">
    <div class="card" onclick="window.location.href='pos.html'">
      <div>💻</div>
      <h3>POS</h3>
      <p>Make sales</p>
    </div>
    
    <div class="card" onclick="window.location.href='products.html'">
      <div>📦</div>
      <h3>Products</h3>
      <p>Manage products, price, stock</p>
      <span class="badge" id="productCount"><span class="loading">Loading...</span></span>
    </div>
    
    <div class="card" onclick="window.location.href='daily-production.html'">
      <div>📊</div>
      <h3>Daily Production</h3>
      <p>Log production & update stock</p>
    </div>
    
    <div class="card" onclick="window.location.href='expenses.html'">
      <div>💵</div>
      <h3>Expenses</h3>
      <p>Log expenses and costs</p>
      <span class="badge" id="expenseCount"><span class="loading">Loading...</span></span>
    </div>
    
    <div class="card" onclick="window.location.href='net-profet.html'">
      <div>💰</div>
      <h3>Net Profit</h3>
      <p>Sales & Expenses report</p>
    </div>
    
    <div class="card danger" onclick="resetData()">
      <div>⚠️</div>
      <h3>Reset Data</h3>
      <p>Danger zone</p>
    </div>
  </div>
</div>

<script type="module">
import { db } from './firebase-config.js';
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

window.login = login;
window.logout = logout;
window.resetData = resetData;

function login() {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();
  
  if(user === 'admin' && pass === '1234') {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('errorMsg').style.display = 'none';
    loadCounts();
  } else {
    document.getElementById('errorMsg').style.display = 'block';
  }
}

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
}

async function loadCounts() {
  try {
    // Products count from dhan-pos-web
    const productsSnap = await getDocs(collection(db, "dhan-pos-web"));
    document.getElementById('productCount').textContent = productsSnap.size + ' Products';
    
    // Expenses count from dhan-expenses
    const expensesSnap = await getDocs(collection(db, "dhan-expenses"));
    document.getElementById('expenseCount').textContent = expensesSnap.size + ' Entries';
    
  } catch (error) {
    console.error("Error loading counts: ", error);
    document.getElementById('productCount').textContent = 'Error';
    document.getElementById('expenseCount').textContent = 'Error';
  }
}

function resetData() {
  alert('Delete mo sa Firebase Console para safe boss. Delikado pag nasa frontend yan.');
}

document.addEventListener('keypress', function(e) {
  if(e.key === 'Enter') login();
});
</script>
</body>
</html>
