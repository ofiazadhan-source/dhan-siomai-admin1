<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Store - DHAN SIOMAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {background:linear-gradient(135deg, #FFF8E1, #FFE0B2);}
.header {
  background: linear-gradient(135deg, #D32F2F, #B71C1C);
  color:white;
  padding:15px;
  text-align:center;
  box-shadow:0 4px 12px rgba(211,47,47,0.3);
}
.header h1 {font-size:20px; font-weight:700;}
.container {padding:15px; max-width:1100px; margin:0 auto;}
.grid {display:grid; gap:15px; grid-template-columns:2fr 1fr;}
@media (max-width:768px){.grid{grid-template-columns:1fr;}}

.card {
  background:white;
  border-radius:16px;
  padding:18px;
  box-shadow:0 4px 16px rgba(0,0,0,0.08);
}

.product-grid {
  display:grid;
  gap:12px;
  grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
}

.product-card {
  border:2px solid #FFE0B2;
  border-radius:12px;
  padding:12px;
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}
.product-card:hover {border-color:#D32F2F; transform:translateY(-2px);}
.product-card img {
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:8px;
}
.product-card h4 {font-size:15px; color:#333; margin-bottom:4px;}
.product-card p {font-size:14px; color:#D32F2F; font-weight:700;}
.product-card small {font-size:12px; color:#666;}

.cart-item {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #FFE0B2;
}
.cart-item:last-child {border-bottom:none;}
.qty-controls {
  display:flex;
  align-items:center;
  gap:8px;
}
.qty-controls button {
  width:28px;
  height:28px;
  border:none;
  border-radius:6px;
  background:#D32F2F;
  color:white;
  font-weight:700;
  cursor:pointer;
}
.qty-controls span {font-weight:600; min-width:20px; text-align:center;}

input, textarea {
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  border:2px solid #FFE0B2;
  font-size:14px;
}
input:focus, textarea:focus {outline:none; border-color:#FFC107;}
label {font-weight:600; color:#D32F2F; font-size:14px; margin-bottom:5px; display:block;}

.checkout-btn {
  width:100%;
  padding:14px;
  background:linear-gradient(135deg, #4caf50, #66bb6a);
  color:white;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  margin-top:15px;
}
.checkout-btn:disabled {background:#ccc; cursor:not-allowed;}

.proof-preview {
  max-width:100%;
  max-height:200px;
  object-fit:contain;
  border-radius:10px;
  margin-top:10px;
  display:none;
}

.note {
  background:#E3F2FD;
  padding:10px;
  border-radius:8px;
  font-size:13px;
  color:#1565C0;
  margin-bottom:15px;
}
.loading {text-align:center; padding:40px; color:#666;}
</style>
</head>
<body>
<div class="header">
  <h1>🛒 DHAN SIOMAI Online Store</h1>
</div>

<div class="container">
  <div class="grid">
    <!-- Products -->
    <div class="card">
      <h3 style="margin-bottom:12px; color:#D32F2F;">📦 Available Products</h3>
      <div id="productList" class="product-grid">
        <div class="loading">Loading products...</div>
      </div>
    </div>

    <!-- Checkout Form -->
    <div class="card">
      <h3 style="margin-bottom:12px; color:#D32F2F;">🛒 Your Order</h3>
      
      <div id="cartList">
        <p style="text-align:center; color:#999; padding:20px;">Cart is empty</p>
      </div>

      <div style="margin-top:15px; padding-top:15px; border-top:2px solid #FFE0B2;">
        <div style="display:flex; justify-content:space-between; font-size:18px; font-weight:700; color:#D32F2F;">
          <span>Total:</span>
          <span id="grandTotal">₱0</span>
        </div>
      </div>

      <div style="margin-top:20px;">
        <h3 style="margin-bottom:12px; color:#D32F2F;">📋 Customer Details</h3>
        
        <label>Full Name</label>
        <input type="text" id="custName" placeholder="Juan Dela Cruz">

        <label>Contact Number</label>
        <input type="tel" id="custPhone" placeholder="09XXXXXXXXX">

        <label>Delivery Address</label>
        <textarea id="custAddress" rows="3" placeholder="House No, Street, Barangay, City"></textarea>

        <div class="note">
          📌 Delivery via Lalamove/Grab. Customer will shoulder the delivery fee. 
          We will contact you for delivery booking after confirming payment.
        </div>

        <label>GCash Proof of Payment</label>
        <input type="file" id="proofUpload" accept="image/*">
        <img id="proofPreview" class="proof-preview">

        <button class="checkout-btn" id="orderBtn" onclick="placeOrder()" disabled>
          ✅ Place Order
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { db } from './firebase-config.js';
import {
  collection, addDoc, onSnapshot, getDoc, doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let products = [];
let cart = [];
let proofBase64 = '';

// Load products
onSnapshot(collection(db, "dhan-pos-web"), (snapshot) => {
  products = [];
  snapshot.forEach(docSnap => {
    let p = docSnap.data();
    p.id = docSnap.id;
    if(p.stock > 0) products.push(p);
  });
  renderProducts();
});

// Render products
function renderProducts() {
  const container = document.getElementById('productList');

  if(products.length === 0) {
    container.innerHTML = '<div class="loading">No products available</div>';
    return;
  }

  container.innerHTML = '';
  products.forEach(p => {
    const imgUrl = p.image || 'https://via.placeholder.com/180x120?text=No+Image';
    container.innerHTML += `
    <div class="product-card" onclick="addToCart('${p.id}')">
      <img src="${imgUrl}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/180x120?text=No+Image'">
      <h4>${p.name}</h4>
      <p>₱${p.price || 0}</p>
      <small>Stock: ${p.stock}</small>
    </div>`;
  });
}

// Add to cart
window.addToCart = function(productId) {
  const product = products.find(p => p.id === productId);
  if(!product) return;

  const existing = cart.find(item => item.id === productId);

  if(existing) {
    if(existing.qty >= product.stock) {
      alert('⚠️ Not enough stock!');
      return;
    }
    existing.qty++;
  } else {
    cart.push({
      id: product.id,
      name: product.name,
      price: product.price || 0,
      qty: 1,
      stock: product.stock
    });
  }

  renderCart();
}

// Update qty
window.updateQty = function(productId, change) {
  const item = cart.find(i => i.id === productId);
  const product = products.find(p => p.id === productId);

  item.qty += change;

  if(item.qty <= 0) {
    cart = cart.filter(i => i.id !== productId);
  }

  if(item.qty > product.stock) {
    alert('⚠️ Not enough stock!');
    item.qty = product.stock;
  }

  renderCart();
}

// Render cart
function renderCart() {
  const container = document.getElementById('cartList');
  const orderBtn = document.getElementById('orderBtn');

  if(cart.length === 0) {
    container.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">Cart is empty</p>';
    orderBtn.disabled = true;
  } else {
    container.innerHTML = '';
    let total = 0;
    cart.forEach(item => {
      total += item.price * item.qty;
      container.innerHTML += `
      <div class="cart-item">
        <div>
          <strong>${item.name}</strong><br>
          <small>₱${item.price} x ${item.qty}</small>
        </div>
        <div class="qty-controls">
          <button onclick="updateQty('${item.id}', -1)">-</button>
          <span>${item.qty}</span>
          <button onclick="updateQty('${item.id}', 1)">+</button>
        </div>
      </div>`;
    });
    document.getElementById('grandTotal').textContent = `₱${total.toLocaleString()}`;
    orderBtn.disabled = false;
  }

  checkForm();
}

// Image compression
async function compressImage(file, maxWidth, quality) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if(width > maxWidth) {
          height = (maxWidth / width) * height;
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      }
    }
  });
}

// Handle proof upload
document.getElementById('proofUpload').onchange = async function(e){
  const file = e.target.files[0];
  if(file){
    proofBase64 = await compressImage(file, 800, 0.7);
    document.getElementById('proofPreview').src = proofBase64;
    document.getElementById('proofPreview').style.display = 'block';
    checkForm();
  }
}

// Check if form is valid
function checkForm() {
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  
  const valid = name && phone && address && cart.length > 0 && proofBase64;
  document.getElementById('orderBtn').disabled = !valid;
}

document.getElementById('custName').oninput = checkForm;
document.getElementById('custPhone').oninput = checkForm;
document.getElementById('custAddress').oninput = checkForm;

// Place order
window.placeOrder = async function() {
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

  if(!name ||!phone ||!address) {
    alert('❌ Fill up all customer details!');
    return;
  }

  if(!proofBase64) {
    alert('❌ Please upload GCash proof of payment!');
    return;
  }

  try {
    await addDoc(collection(db, "online-orders"), {
      customer: {
        name: name,
        phone: phone,
        address: address
      },
      items: cart,
      total: total,
      paymentMethod: 'GCash',
      proofOfPayment: proofBase64,
      status: 'pending',
      delivery: 'Lalamove/Grab - Customer pays delivery fee',
      timestamp: new Date(),
      date: new Date().toISOString().split('T')[0]
    });

    alert(`✅ Order placed successfully!\n\nTotal: ₱${total.toLocaleString()}\n\nWe will contact you once we confirm your payment and arrange delivery via Lalamove/Grab.`);

    // Reset
    cart = [];
    proofBase64 = '';
    document.getElementById('custName').value = '';
    document.getElementById('custPhone').value = '';
    document.getElementById('custAddress').value = '';
    document.getElementById('proofUpload').value = '';
    document.getElementById('proofPreview').style.display = 'none';
    renderCart();

  } catch(e) {
    alert('❌ Error: ' + e.message);
  }
}
</script>
</body>
</html>
