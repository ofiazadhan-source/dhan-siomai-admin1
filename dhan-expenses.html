<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses - Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {background:#FFF8E1;}
.header {background:linear-gradient(135deg, #D32F2F, #B71C1C); color:white; padding:15px; display:flex; justify-content:space-between; align-items:center;}
.container {padding:15px; max-width:800px; margin:0 auto;}
.card {background:white; padding:20px; border-radius:12px; box-shadow:0 3px 8px rgba(0,0,0,0.1); margin-bottom:15px;}
input, textarea {
  width:100%;
  padding:12px;
  margin:8px 0;
  border:2px solid #FFE0B2;
  border-radius:10px;
}
input:focus, textarea:focus {outline:none; border-color:#FFC107;}
.btn {
  width:100%;
  padding:12px;
  background:linear-gradient(135deg, #D32F2F, #B71C1C);
  color:white;
  border:none;
  border-radius:10px;
  font-weight:600;
}
.expense-item {
  padding:12px;
  border-bottom:1px solid #FFE0B2;
  display:flex;
  justify-content:space-between;
}
</style>
</head>
<body>
<div class="header">
  <h1>💸 Expenses</h1>
  <a href="index.html" style="color:white;text-decoration:none;">← Back</a>
</div>

<div class="container">
  <div class="card">
    <h3 style="color:#D32F2F;margin-bottom:10px;">Add Expense</h3>
    <input type="text" id="expDesc" placeholder="Description">
    <input type="number" id="expAmount" placeholder="Amount">
    <textarea id="expNote" placeholder="Note (optional)" rows="2"></textarea>
    <button class="btn" onclick="addExpense()">Add Expense</button>
  </div>

  <div class="card">
    <h3 style="color:#D32F2F;margin-bottom:10px;">Recent Expenses</h3>
    <div id="expenseList">Loading...</div>
  </div>
</div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyDk3ZbOXuw3PEfJzdt8AI2ueJq5yksfekE",
authDomain: "dhan-siomai-pos-fe1e5.firebaseapp.com",
projectId: "dhan-siomai-pos-fe1e5",
storageBucket: "dhan-siomai-pos-fe1e5.firebasestorage.app",
messagingSenderId: "305932123173",
appId: "1:305932123173:web:f27894a2d5e6e6ab8253cc"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

db.collection("expenses").orderBy("date", "desc").limit(50).onSnapshot(snap => {
  const list = document.getElementById("expenseList");
  if(snap.empty) {
    list.innerHTML = '<p>No expenses yet</p>';
    return;
  }

  list.innerHTML = '';
  snap.forEach(doc => {
    const e = doc.data();
    list.innerHTML += `
    <div class="expense-item">
      <div>
        <strong>${e.description}</strong><br>
        <small style="color:#666;">${e.date?.toDate().toLocaleDateString() || ''}</small>
      </div>
      <div style="color:#D32F2F;font-weight:700;">₱${e.amount}</div>
    </div>`;
  });
});

async function addExpense() {
  const desc = document.getElementById('expDesc').value.trim();
  const amount = parseFloat(document.getElementById('expAmount').value);
  const note = document.getElementById('expNote').value.trim();

  if(!desc ||!amount) {
    alert('Fill description and amount');
    return;
  }

  await db.collection("expenses").add({
    description: desc,
    amount: amount,
    note: note,
    date: new Date()
  });

  document.getElementById('expDesc').value = '';
  document.getElementById('expAmount').value = '';
  document.getElementById('expNote').value = '';
  alert('Expense added!');
}
</script>
</body>
</html>
