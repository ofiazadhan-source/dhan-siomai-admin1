
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales - DHAN SIOMAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {background:#f5f5f5; padding:20px;}
.header {display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.header h1 {font-size:22px; color:#ff6b35;}
.container {max-width:900px; margin:0 auto;}
.card {background:white; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:15px;}
.summary {display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:15px; margin-bottom:20px;}
.summary-box {background:#ff6b35; color:white; padding:15px; border-radius:10px; text-align:center;}
.summary-box h4 {font-size:13px; font-weight:400; opacity:0.9;}
.summary-box p {font-size:22px; font-weight:700; margin-top:5px;}
table {width:100%; border-collapse:collapse;}
th, td {padding:12px; text-align:left; border-bottom:1px solid #eee; font-size:14px;}
th {background:#f8f8f8; font-weight:700;}
.items-list {font-size:12px; color:#666;}
@media (max-width:768px) {
  table {font-size:12px;}
  th, td {padding:8px;}
}
</style>
</head>
<body>

<div class="header">
  <h1>📊 Sales Records</h1>
  <a href="index.html" style="color:#ff6b35; text-decoration:none; font-weight:600;">← Back</a>
</div>

<div class="container">
  <div class="summary">
    <div class="summary-box">
      <h4>Today Sales</h4>
      <p>₱<span id="todaySales">0</span></p>
    </div>
    <div class="summary-box">
      <h4>This Month</h4>
      <p>₱<span id="monthSales">0</span></p>
    </div>
    <div class="summary-box">
      <h4>Total Transactions</h4>
      <p id="totalTrans">0</p>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:15px;">Recent Sales</h3>
    <table>
      <thead>
        <tr>
          <th>Date & Time</th>
          <th>Items</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="salesTable">
        <tr><td colspan="3">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
import { db } from './firebase-config.js';
import { collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

onSnapshot(query(collection(db, "sales"), orderBy("date", "desc")), (snapshot) => {
  const tbody = document.getElementById("salesTable");
  let todayTotal = 0;
  let monthTotal = 0;
  
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  
  if(snapshot.empty) {
    tbody.innerHTML = '<tr><td colspan="3">No sales yet</td></tr>';
    return;
  }
  
  tbody.innerHTML = '';
  snapshot.forEach(docSnap => {
    const s = docSnap.data();
    const date = s.date?.toDate ? s.date.toDate() : new Date();
    const dateStr = date.toLocaleString('en-PH', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
    
    const itemsStr = s.items.map(i => `${i.name} x${i.qty}`).join(', ');
    
    tbody.innerHTML += `
      <tr>
        <td>${dateStr}</td>
        <td class="items-list">${itemsStr}</td>
        <td>₱${s.total}</td>
      </tr>
    `;
    
    if(date >= todayStart) todayTotal += s.total;
    if(date >= monthStart) monthTotal += s.total;
  });
  
  document.getElementById("todaySales").textContent = todayTotal;
  document.getElementById("monthSales").textContent = monthTotal;
  document.getElementById("totalTrans").textContent = snapshot.size;
});
</script>
</body>
</html>
