<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales - DHAN SIOMAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {background:#f5f5f5; padding:15px;}
.header {display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;}
.header h1 {font-size:20px; color:#ff6b35;}
.card {background:white; padding:15px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:15px;}
.summary {display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-bottom:15px;}
.summary-box {background:#ff6b35; color:white; padding:12px; border-radius:10px; text-align:center;}
.summary-box h4 {font-size:12px; font-weight:400; opacity:0.9;}
.summary-box p {font-size:18px; font-weight:700; margin-top:5px;}
table {width:100%; border-collapse:collapse; font-size:13px;}
th, td {padding:10px 8px; text-align:left; border-bottom:1px solid #eee; vertical-align:top;}
th {background:#f8f8f8; font-weight:700;}
.item-row {display:flex; justify-content:space-between; margin-bottom:3px;}
.payment-badge {display:inline-block; padding:3px 8px; border-radius:12px; font-size:11px; font-weight:600; margin-top:5px;}
.payment-cash {background:#e8f5e9; color:#2e7d32;}
.payment-gcash {background:#e3f2fd; color:#1976d2;}
.proof-img {max-width:80px; max-height:80px; margin-top:5px; border-radius:6px; cursor:pointer; border:1px solid #ddd;}
@media (max-width:768px) {
  .summary {grid-template-columns: 1fr;}
  table {font-size:12px;}
  th, td {padding:8px 6px;}
}
</style>
</head>
<body>

<div class="header">
  <h1>📊 Sales Records</h1>
  <a href="index.html" style="color:#ff6b35; text-decoration:none; font-weight:600;">← Back</a>
</div>

<div class="summary">
  <div class="summary-box">
    <h4>Today</h4>
    <p>₱<span id="todaySales">0</span></p>
  </div>
  <div class="summary-box">
    <h4>This Month</h4>
    <p>₱<span id="monthSales">0</span></p>
  </div>
  <div class="summary-box">
    <h4>Transactions</h4>
    <p id="totalTrans">0</p>
  </div>
</div>

<div class="card">
  <h3 style="margin-bottom:12px;">Recent Sales</h3>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Items Sold</th>
        <th>Payment</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="salesTable">
      <tr><td colspan="4">Loading...</td></tr>
    </tbody>
  </table>
</div>

<!-- Image Modal -->
<div id="imgModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;" onclick="this.style.display='none'">
  <img id="modalImg" style="max-width:90%; max-height:90%;">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDk3ZbOXuw3PEfJzdt8AI2ueJq5yksfekE",
  authDomain: "dhan-siomai-pos-fe1e5.firebaseapp.com",
  projectId: "dhan-siomai-pos-fe1e5",
  storageBucket: "dhan-siomai-pos-fe1e5.firebasestorage.app",
  messagingSenderId: "305932123173",
  appId: "1:305932123173:web:f27894a2d5e6e6ab8253cc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

onSnapshot(query(collection(db, "sales"), orderBy("date", "desc")), (snapshot) => {
  const tbody = document.getElementById("salesTable");
  let todayTotal = 0;
  let monthTotal = 0;
  
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  
  if(snapshot.empty) {
    tbody.innerHTML = '<tr><td colspan="4">No sales yet</td></tr>';
    document.getElementById("todaySales").textContent = 0;
    document.getElementById("monthSales").textContent = 0;
    document.getElementById("totalTrans").textContent = 0;
    return;
  }
  
  tbody.innerHTML = '';
  snapshot.forEach(docSnap => {
    const s = docSnap.data();
    const date = s.date?.toDate ? s.date.toDate() : new Date();
    const dateStr = date.toLocaleString('en-PH', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
    
    // Items list
    let itemsHtml = '';
    s.items.forEach(item => {
      itemsHtml += `<div class="item-row">
        <span>${item.name} x${item.qty}</span>
        <span>₱${item.price * item.qty}</span>
      </div>`;
    });
    
    // Payment badge
    const payMethod = s.paymentMethod || 'cash';
    const payBadge = payMethod === 'gcash' 
      ? '<span class="payment-badge payment-gcash">📱 GCash</span>' 
      : '<span class="payment-badge payment-cash">💵 Cash</span>';
    
    // Proof image if GCash
    const proofHtml = s.proof 
      ? `<br><img src="${s.proof}" class="proof-img" onclick="showImage('${s.proof}')">` 
      : '';
    
    tbody.innerHTML += `
      <tr>
        <td>${dateStr}</td>
        <td>${itemsHtml}</td>
        <td>${payBadge}${proofHtml}</td>
        <td><strong>₱${s.total}</strong></td>
      </tr>
    `;
    
    if(date >= todayStart) todayTotal += s.total;
    if(date >= monthStart) monthTotal += s.total;
  });
  
  document.getElementById("todaySales").textContent = todayTotal;
  document.getElementById("monthSales").textContent = monthTotal;
  document.getElementById("totalTrans").textContent = snapshot.size;
});

window.showImage = function(src) {
  document.getElementById('modalImg').src = src;
  document.getElementById('imgModal').style.display = 'flex';
}
</script>
</body>
</html>
