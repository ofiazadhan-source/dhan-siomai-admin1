<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS - DHAN SIOMAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {background:#FFF8E1;}
.header {
  background: linear-gradient(135deg, #D32F2F, #B71C1C);
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}
.header h1 {font-size:18px; font-weight:700;}
.header a {color:#D32F2F; background:#fff; text-decoration:none; font-weight:600; padding:8px 14px; border-radius:8px;}
.container {padding:15px; max-width:1200px; margin:0 auto;}
.grid {display:grid; gap:15px; grid-template-columns:2fr 1fr;}
@media (max-width:768px){.grid{grid-template-columns:1fr;}}

.card {
  background:white;
  border-radius:16px;
  padding:15px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.product-grid {
  display:grid;
  gap:10px;
  grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
}

.product-card {
  border:2px solid #FFE0B2;
  border-radius:12px;
  padding:10px;
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}
.product-card:active {transform:scale(0.95); border-color:#D32F2F;}
.product-card img {
  width:100%;
  height:90px;
  object-fit:cover;
  border-radius:8px;
  margin-bottom:6px;
}
.product-card h4 {font-size:14px; color:#333; margin-bottom:4px;}
.product-card p {font-size:13px; color:#D32F2F; font-weight:700;}
.product-card small {font-size:12px; color:#666;}

.cart-item {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #FFE0B2;
}
.cart-item:last-child {border-bottom:none;}
.cart-info h4 {font-size:14px; margin-bottom:2px;}
.cart-info p {font-size:13px; color:#666;}
.qty-controls {
  display:flex;
  align-items:center;
  gap:8px;
}
.qty-controls button {
  width:28px;
  height:28px;
  border:none;
  border-radius:6px;
  background:#D32F2F;
  color:white;
  font-weight:700;
  cursor:pointer;
}
.qty-controls span {font-weight:600; min-width:20px; text-align:center;}

.total-section {
  margin-top:15px;
  padding-top:15px;
  border-top:2px solid #FFE0B2;
}
.total-row {
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:15px;
}
.total-row.grand {
  font-size:20px;
  font-weight:700;
  color:#D32F2F;
}

.checkout-btn {
  width:100%;
  padding:14px;
  background:linear-gradient(135deg, #4caf50, #66bb6a);
  color:white;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  margin-top:15px;
}
.checkout-btn:disabled {background:#ccc; cursor:not-allowed;}

.search-box {
  width:100%;
  padding:12px;
  border:2px solid #FFE0B2;
  border-radius:10px;
  margin-bottom:15px;
  font-size:14px;
}
.search-box:focus {outline:none; border-color:#FFC107;}

.loading {text-align:center; padding:40px; color:#666;}
</style>
</head>
<body>
<div class="header">
  <h1>💻 POS</h1>
  <a href="index.html">← Back</a>
</div>

<div class="container">
  <div class="grid">
    <!-- Products Section -->
    <div class="card">
      <input type="text" id="searchBox" class="search-box" placeholder="🔍 Search product...">
      <div id="productList" class="product-grid">
        <div class="loading">Loading products...</div>
      </div>
    </div>

    <!-- Cart Section -->
    <div class="card">
      <h3 style="margin-bottom:12px; color:#D32F2F;">🛒 Cart</h3>
      <div id="cartList">
        <p style="text-align:center; color:#999; padding:20px;">Cart is empty</p>
      </div>

      <div class="total-section">
        <div class="total-row">
          <span>Subtotal:</span>
          <span id="subtotal">₱0</span>
        </div>
        <div class="total-row grand">
          <span>Total:</span>
          <span id="grandTotal">₱0</span>
        </div>
      </div>

      <button class="checkout-btn" id="checkoutBtn" onclick="checkout()" disabled>
        💰 Checkout
      </button>
    </div>
  </div>
</div>

<script type="module">
import { db } from './firebase-config.js';
import {
  collection, doc, addDoc, updateDoc, getDoc, getDocs,
  onSnapshot, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let products = [];
let cart = [];

// Load products live
onSnapshot(collection(db, "dhan-pos-web"), (snapshot) => {
  products = [];
  snapshot.forEach(docSnap => {
    let p = docSnap.data();
    p.id = docSnap.id;
    products.push(p);
  });
  renderProducts(products);
});

// Render products
function renderProducts(list) {
  const container = document.getElementById('productList');

  if(list.length === 0) {
    container.innerHTML = '<div class="loading">No products yet</div>';
    return;
  }

  container.innerHTML = '';
  list.forEach(p => {
    const imgUrl = p.image || 'https://via.placeholder.com/140x90?text=No+Image';
    const stock = p.stock || 0;
    const isOut = stock <= 0;

    container.innerHTML += `
    <div class="product-card" onclick="${isOut? '' : `addToCart('${p.id}')`}" style="${isOut? 'opacity:0.5;cursor:not-allowed;' : ''}">
      <img src="${imgUrl}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/140x90?text=No+Image'">
      <h4>${p.name}</h4>
      <p>₱${p.price || 0}</p>
      <small>Stock: ${stock}</small>
    </div>`;
  });
}

// Search filter
document.getElementById('searchBox').addEventListener('input', (e) => {
  const search = e.target.value.toLowerCase();
  const filtered = products.filter(p => p.name.toLowerCase().includes(search));
  renderProducts(filtered);
});

// Add to cart
window.addToCart = function(productId) {
  const product = products.find(p => p.id === productId);
  if(!product) return;

  const existing = cart.find(item => item.id === productId);

  if(existing) {
    if(existing.qty >= product.stock) {
      alert('⚠️ Not enough stock!');
      return;
    }
    existing.qty++;
  } else {
    if(product.stock <= 0) {
      alert('⚠️ Out of stock!');
      return;
    }
    cart.push({
      id: product.id,
      name: product.name,
      price: product.price || 0,
      qty: 1,
      stock: product.stock
    });
  }

  renderCart();
}

// Remove from cart
window.removeFromCart = function(productId) {
  cart = cart.filter(item => item.id!== productId);
  renderCart();
}

// Update qty
window.updateQty = function(productId, change) {
  const item = cart.find(i => i.id === productId);
  const product = products.find(p => p.id === productId);

  if(!item ||!product) return;

  item.qty += change;

  if(item.qty <= 0) {
    removeFromCart(productId);
    return;
  }

  if(item.qty > product.stock) {
    alert('⚠️ Not enough stock!');
    item.qty = product.stock;
  }

  renderCart();
}

// Render cart
function renderCart() {
  const container = document.getElementById('cartList');
  const checkoutBtn = document.getElementById('checkoutBtn');

  if(cart.length === 0) {
    container.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">Cart is empty</p>';
    checkoutBtn.disabled = true;
  } else {
    container.innerHTML = '';
    cart.forEach(item => {
      container.innerHTML += `
      <div class="cart-item">
        <div class="cart-info">
          <h4>${item.name}</h4>
          <p>₱${item.price} x ${item.qty}</p>
        </div>
        <div class="qty-controls">
          <button onclick="updateQty('${item.id}', -1)">-</button>
          <span>${item.qty}</span>
          <button onclick="updateQty('${item.id}', 1)">+</button>
        </div>
      </div>`;
    });
    checkoutBtn.disabled = false;
  }

  updateTotal();
}

// Update total
function updateTotal() {
  let subtotal = 0;
  cart.forEach(item => {
    subtotal += item.price * item.qty;
  });

  document.getElementById('subtotal').textContent = `₱${subtotal.toLocaleString()}`;
  document.getElementById('grandTotal').textContent = `₱${subtotal.toLocaleString()}`;
}

// Checkout
window.checkout = async function() {
  if(cart.length === 0) return;

  if(!confirm('Confirm checkout?')) return;

  try {
    const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    const timestamp = new Date();

    // Save sale
    await addDoc(collection(db, "dhan-sales"), {
      items: cart,
      total: total,
      timestamp: timestamp,
      date: timestamp.toISOString().split('T')[0]
    });

    // Update stock
    for(let item of cart) {
      await updateDoc(doc(db, "dhan-pos-web", item.id), {
        stock: increment(-item.qty)
      });
    }

    alert(`✅ Sale completed!\nTotal: ₱${total.toLocaleString()}`);

    // Clear cart
    cart = [];
    renderCart();

  } catch(e) {
    alert('❌ Error: ' + e.message);
  }
}
</script>
</body>
</html>
