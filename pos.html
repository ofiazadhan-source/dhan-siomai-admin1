<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS - DHAN SIOMAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {background:#f5f5f5; padding:15px;}
.header {display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;}
.header h1 {font-size:20px; color:#ff6b35;}
.header a {color:#ff6b35; text-decoration:none; font-weight:600;}
.card {background:white; padding:15px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:15px;}
.menu-grid {display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;}
.menu-item {background:#fff; border:2px solid #eee; padding:12px; border-radius:10px; cursor:pointer; text-align:center;}
.menu-item:hover {border-color:#ff6b35;}
.menu-item h4 {font-size:14px; margin-bottom:5px;}
.menu-item p {color:#ff6b35; font-weight:700;}
.cart-item {display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee;}
.btn {width:100%; padding:14px; background:#ff6b35; color:white; border:none; border-radius:12px; font-weight:700; font-size:16px; cursor:pointer;}
.btn:disabled {background:#ccc; cursor:not-allowed;}
.qty-btn {padding:4px 10px; background:#ff6b35; color:white; border:none; border-radius:6px; cursor:pointer; margin:0 3px;}
input[type="file"] {width:100%; padding:10px; border:2px dashed #ddd; border-radius:8px;}
.pay-option {margin-top:15px;}
.pay-option label {margin-right:20px; cursor:pointer;}
</style>
</head>
<body>

<div class="header">
  <h1>🍡 DHAN SIOMAI POS</h1>
  <a href="dashboard.html">Dashboard</a>
</div>

<div class="card">
  <h3>Menu</h3>
  <div class="menu-grid" id="menuGrid"></div>
</div>

<div class="card">
  <h3>Cart</h3>
  <div id="cartItems"><p style="color:#999;">Cart empty</p></div>
  <h3 style="margin-top:15px;">Total: ₱<span id="cartTotal">0</span></h3>

  <div class="pay-option">
    <label><input type="radio" name="pay" value="Cash" checked> 💵 Cash</label>
    <label><input type="radio" name="pay" value="GCash"> 📱 GCash</label>
  </div>

  <div id="gcashUpload" style="display:none; margin-top:10px;">
    <label style="font-size:13px; color:#666;">Upload GCash Proof:</label>
    <input type="file" id="proofFile" accept="image/*">
  </div>

  <button class="btn" id="checkoutBtn" onclick="checkout()" style="margin-top:15px;" disabled>Checkout</button>
</div>

<script type="module">
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import { db } from './firebase-config.js';
const storage = getStorage();

const menu = [
  {name:"Pork Siomai", price:15},
  {name:"Chicken Siomai", price:15},
  {name:"Japanese Siomai", price:20},
  {name:"Rice", price:10},
  {name:"Siomai Rice", price:35}
];

let cart = [];

window.addToCart = function(index) {
  const item = menu[index];
  const existing = cart.find(i => i.name === item.name);
  if(existing) existing.qty++;
  else cart.push({...item, qty:1});
  renderCart();
}

function renderCart() {
  const div = document.getElementById('cartItems');
  if(cart.length === 0) {
    div.innerHTML = '<p style="color:#999;">Cart empty</p>';
    document.getElementById('checkoutBtn').disabled = true;
    document.getElementById('cartTotal').textContent = 0;
    return;
  }

  let total = 0;
  div.innerHTML = cart.map((item, i) => {
    total += item.price * item.qty;
    return `
      <div class="cart-item">
        <div>${item.name} x${item.qty}</div>
        <div>
          ₱${item.price * item.qty}
          <button class="qty-btn" onclick="changeQty(${i}, -1)">-</button>
          <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('cartTotal').textContent = total;
  document.getElementById('checkoutBtn').disabled = false;
}

window.changeQty = function(index, change) {
  cart[index].qty += change;
  if(cart[index].qty <= 0) cart.splice(index, 1);
  renderCart();
}

document.getElementById('menuGrid').innerHTML = menu.map((item, i) => `
  <div class="menu-item" onclick="addToCart(${i})">
    <h4>${item.name}</h4>
    <p>₱${item.price}</p>
  </div>
`).join('');

document.querySelectorAll('input[name="pay"]').forEach(radio => {
  radio.addEventListener('change', (e) => {
    document.getElementById('gcashUpload').style.display = e.target.value === 'GCash'? 'block' : 'none';
  });
});

window.checkout = async function() {
  const btn = document.getElementById('checkoutBtn');
  btn.disabled = true;
  btn.textContent = 'Processing...';

  const paymentMethod = document.querySelector('input[name="pay"]:checked').value;
  const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);

  try {
    if(paymentMethod === 'GCash') {
      const file = document.getElementById('proofFile').files[0];
      if(!file) throw new Error('Please upload GCash proof first');

      // Upload to Firebase Storage
      const storageRef = ref(storage, `proofs/${Date.now()}_${file.name}`);
      await uploadBytes(storageRef, file);
      const proofUrl = await getDownloadURL(storageRef);

      // Save as PENDING for admin approval
      await addDoc(collection(db, "sales"), {
        items: cart,
        total: total,
        paymentMethod: "GCash",
        proofOfPayment: proofUrl,
        date: new Date(),
        status: "pending",
        approvedBy: null,
        approvedAt: null
      });

      alert('GCash payment submitted! Waiting for admin approval.');

    } else {
      // Cash is auto-approved
      await addDoc(collection(db, "sales"), {
        items: cart,
        total: total,
        paymentMethod: "Cash",
        date: new Date(),
        status: "approved"
      });

      alert('Sale recorded successfully!');
    }

    // Reset cart
    cart = [];
    renderCart();
    document.getElementById('proofFile').value = '';

  } catch(error) {
    alert('Error: ' + error.message);
  }

  btn.disabled = false;
  btn.textContent = 'Checkout';
}
</script>
</body>
</html>
