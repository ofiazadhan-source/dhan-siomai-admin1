<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHAN SIOMAI POS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {background:#f5f5f5; padding:15px;}
.header {display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;}
.header h1 {font-size:20px; color:#ff6b35;}
.container {display:grid; grid-template-columns: 2fr 1fr; gap:15px;}
.products, .cart {background:white; padding:15px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.product-grid {display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap:10px;}
.product-card {border:2px solid #eee; padding:12px; border-radius:10px; text-align:center; cursor:pointer; transition:0.2s;}
.product-card:hover {border-color:#ff6b35;}
.product-name {font-weight:700; font-size:14px; margin-bottom:5px;}
.product-price {color:#ff6b35; font-weight:600; font-size:15px;}
.product-stock {font-size:12px; color:#666;}
.cart-item {display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid #eee; font-size:14px;}
.total {font-size:18px; font-weight:700; margin:15px 0;}
.btn {width:100%; padding:14px; background:#ff6b35; color:white; border:none; border-radius:8px; font-weight:700; cursor:pointer; font-size:16px;}
.btn:hover {background:#e55a2b;}
.btn:disabled {background:#ccc; cursor:not-allowed;}
.qty-btn {background:#ff6b35; color:white; border:none; padding:2px 8px; border-radius:4px; cursor:pointer;}
@media (max-width:768px) {
  .container {grid-template-columns: 1fr;}
}
</style>
</head>
<body>

<div class="header">
  <h1>💻 POS</h1>
  <a href="index.html" style="color:#ff6b35; text-decoration:none; font-weight:600;">← Back</a>
</div>

<div class="container">
  <div class="products">
    <h3 style="margin-bottom:12px;">Products</h3>
    <div class="product-grid" id="productList">Loading products...</div>
  </div>

  <div class="cart">
    <h3 style="margin-bottom:12px;">Cart</h3>
    <div id="cartItems">Empty cart</div>
    <div class="total">Total: ₱<span id="total">0</span></div>
    <button class="btn" id="checkoutBtn" onclick="checkout()" disabled>Checkout</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDk3ZbOXuw3PEfJzdt8AI2ueJq5yksfekE",
  authDomain: "dhan-siomai-pos-fe1e5.firebaseapp.com",
  projectId: "dhan-siomai-pos-fe1e5",
  storageBucket: "dhan-siomai-pos-fe1e5.firebasestorage.app",
  messagingSenderId: "305932123173",
  appId: "1:305932123173:web:f27894a2d5e6e6ab8253cc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let cart = [];
let products = [];

onSnapshot(collection(db, "products"), (snapshot) => {
  products = [];
  snapshot.forEach(doc => {
    products.push({id: doc.id, ...doc.data()});
  });
  renderProducts();
});

function renderProducts() {
  const list = document.getElementById("productList");
  if(products.length === 0) {
    list.innerHTML = "No products yet. Add sa Products page.";
    return;
  }
  list.innerHTML = products.map(p => `
    <div class="product-card" onclick="addToCart('${p.id}')">
      <div class="product-name">${p.name}</div>
      <div class="product-price">₱${p.price}</div>
      <div class="product-stock">Stock: ${p.stock || 0}</div>
    </div>
  `).join('');
}

window.addToCart = function(productId) {
  const product = products.find(p => p.id === productId);
  if(product.stock <= 0) {
    alert("Out of stock na boss");
    return;
  }
  const existing = cart.find(item => item.id === productId);
  if(existing) {
    if(existing.qty >= product.stock) {
      alert("Wala nang stock");
      return;
    }
    existing.qty += 1;
  } else {
    cart.push({...product, qty: 1});
  }
  renderCart();
}

window.removeFromCart = function(productId) {
  cart = cart.filter(item => item.id !== productId);
  renderCart();
}

window.changeQty = function(productId, change) {
  const item = cart.find(i => i.id === productId);
  const product = products.find(p => p.id === productId);
  item.qty += change;
  if(item.qty <= 0) {
    removeFromCart(productId);
  } else if(item.qty > product.stock) {
    alert("Sobra sa stock boss");
    item.qty = product.stock;
  }
  renderCart();
}

function renderCart() {
  const cartDiv = document.getElementById("cartItems");
  const totalSpan = document.getElementById("total");
  const checkoutBtn = document.getElementById("checkoutBtn");
  
  if(cart.length === 0) {
    cartDiv.innerHTML = "Empty cart";
    totalSpan.textContent = "0";
    checkoutBtn.disabled = true;
    return;
  }
  
  let total = 0;
  cartDiv.innerHTML = cart.map(item => {
    total += item.price * item.qty;
    return `
      <div class="cart-item">
        <div>
          <div>${item.name}</div>
          <div>
            <button class="qty-btn" onclick="changeQty('${item.id}', -1)">-</button>
            <span style="margin:0 8px;">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
          </div>
        </div>
        <div>₱${item.price * item.qty}</div>
      </div>
    `;
  }).join('');
  
  totalSpan.textContent = total;
  checkoutBtn.disabled = false;
}

window.checkout = async function() {
  if(cart.length === 0) return;
  
  const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  
  try {
    await runTransaction(db, async (transaction) => {
      for(const item of cart) {
        const productRef = doc(db, "products", item.id);
        const productSnap = await transaction.get(productRef);
        
        if(!productSnap.exists()) throw new Error(item.name + " not found");
        
        const currentStock = productSnap.data().stock || 0;
        if(currentStock < item.qty) throw new Error("Not enough stock for " + item.name);
        
        transaction.update(productRef, { stock: currentStock - item.qty });
      }
      
      transaction.set(doc(collection(db, "sales")), {
        items: cart,
        total: total,
        date: serverTimestamp()
      });
    });
    
    alert("Sale recorded! Stocks updated boss.");
    cart = [];
    renderCart();
  } catch(e) {
    alert("Error: " + e.message);
  }
}
</script>
</body>
</html>
