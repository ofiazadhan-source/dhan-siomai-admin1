<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS - DHAN SIOMAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {background:linear-gradient(135deg, #fff5f0, #ffe8dd); min-height:100vh;}
.header {
  background: linear-gradient(135deg, #ff6b35, #ff8c65);
  color:white; padding:15px; display:flex; justify-content:space-between; align-items:center;
  box-shadow:0 4px 12px rgba(255,107,53,0.3);
}
.header h1 { font-size: 18px; font-weight:700; display:flex; align-items:center; gap:8px; }
.header a { color:#ff6b35; background:#fff; text-decoration:none; font-weight:600; padding:8px 14px; border-radius:8px; }

.container {padding:15px;}
.card {background:white; padding:18px; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,0.08); margin-bottom:15px;}

.product-grid {
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:12px;
}
.product-card {
  background:white; border-radius:14px; padding:10px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
  border:2px solid #ffd4c2;
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}
.product-card:active {transform:scale(0.96); border-color:#ff6b35;}
.product-img {
  width:100%; height:80px; object-fit:cover; border-radius:10px; margin-bottom:6px;
  background:#ffe8dd;
}
.product-name {font-size:13px; font-weight:600; color:#333; margin-bottom:4px;}
.product-price {font-size:15px; font-weight:700; color:#ff6b35;}
.product-stock {font-size:11px; color:#666;}

.cart-item {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 0; border-bottom:1px solid #eee;
}
.cart-item-info {flex:1;}
.cart-item-name {font-weight:600; font-size:14px;}
.cart-item-qty {font-size:12px; color:#666;}
.cart-controls {display:flex; gap:8px; align-items:center;}
.cart-controls button {
  width:30px; height:30px; padding:0; border-radius:50%;
  background:#ff6b35; color:white; border:none; font-weight:700;
}

.checkout-btn {
  width:100%; padding:14px; background:linear-gradient(135deg, #4caf50, #66bb6a);
  color:white; border:none; border-radius:12px; font-weight:700; font-size:16px;
  margin-top:10px;
}
.checkout-btn:disabled {background:#ccc;}

.total {
  font-size:20px; font-weight:700; color:#ff6b35; text-align:right; margin-top:10px;
}
</style>
</head>
<body>
<div class="header">
  <h1><img src="logo.png" style="height:30px;"> POS</h1>
  <a href="index.html">← Back</a>
</div>

<div class="container">
  <div class="card">
    <h3 style="margin-bottom:12px; color:#ff6b35;">🛒 Products</h3>
    <div id="productGrid" class="product-grid">Loading...</div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px; color:#ff6b35;">🧾 Cart</h3>
    <div id="cartItems">Empty cart</div>
    <div class="total" id="totalAmount">Total: ₱0</div>
    <button class="checkout-btn" id="checkoutBtn" disabled onclick="checkout()">Checkout</button>
  </div>
</div>

<script type="module">
import { getFirestore, collection, onSnapshot, doc, updateDoc, increment, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db } from './firebase-config.js';

let cart = [];
let products = {};

// Load products with images
onSnapshot(collection(db, "products"), (snapshot) => {
  const grid = document.getElementById("productGrid");
  grid.innerHTML = '';

  snapshot.forEach(docSnap => {
    const p = docSnap.data();
    products[docSnap.id] = {id: docSnap.id,...p};

    const imgUrl = p.imageUrl || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAiIGhlaWdodD0iODAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjgwIiBoZWlnaHQ9IjgwIiBmaWxsPSIjZmZlOGRkIi8+PHRleHQgeD0iNDAiIHk9IjQwIiBmb250LXNpemU9IjEwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjZmY2YjM1Ij5ObyBJbWc8L3RleHQ+PC9zdmc+';

    grid.innerHTML += `
      <div class="product-card" onclick="addToCart('${docSnap.id}')">
        <img src="${imgUrl}" class="product-img" alt="${p.name}">
        <div class="product-name">${p.name}</div>
        <div class="product-price">₱${p.price}</div>
        <div class="product-stock">Stock: ${p.stock || 0}</div>
      </div>
    `;
  });
});

// Add to cart
window.addToCart = function(id) {
  const product = products[id];
  if(!product || product.stock <= 0) {
    alert("Out of stock!");
    return;
  }

  const existing = cart.find(item => item.id === id);
  if(existing) {
    if(existing.qty >= product.stock) {
      alert("Not enough stock!");
      return;
    }
    existing.qty++;
  } else {
    cart.push({id, name: product.name, price: product.price, qty: 1});
  }
  updateCart();
};

// Update cart display
function updateCart() {
  const cartDiv = document.getElementById("cartItems");
  const totalDiv = document.getElementById("totalAmount");
  const checkoutBtn = document.getElementById("checkoutBtn");

  if(cart.length === 0) {
    cartDiv.innerHTML = "Empty cart";
    totalDiv.innerHTML = "Total: ₱0";
    checkoutBtn.disabled = true;
    return;
  }

  let total = 0;
  cartDiv.innerHTML = '';

  cart.forEach(item => {
    total += item.price * item.qty;
    cartDiv.innerHTML += `
      <div class="cart-item">
        <div class="cart-item-info">
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-qty">₱${item.price} x ${item.qty}</div>
        </div>
        <div class="cart-controls">
          <button onclick="changeQty('${item.id}', -1)">-</button>
          <span>${item.qty}</span>
          <button onclick="changeQty('${item.id}', 1)">+</button>
        </div>
      </div>
    `;
  });

  totalDiv.innerHTML = `Total: ₱${total}`;
  checkoutBtn.disabled = false;
}

// Change quantity
window.changeQty = function(id, change) {
  const item = cart.find(i => i.id === id);
  const product = products[id];

  item.qty += change;

  if(item.qty <= 0) {
    cart = cart.filter(i => i.id!== id);
  } else if(item.qty > product.stock) {
    alert("Not enough stock!");
    item.qty = product.stock;
  }

  updateCart();
};

// Checkout
window.checkout = async function() {
  if(cart.length === 0) return;

  try {
    await addDoc(collection(db, "sales"), {
      items: cart,
      total: cart.reduce((sum, i) => sum + i.price * i.qty, 0),
      date: new Date()
    });

    for(const item of cart) {
      await updateDoc(doc(db, "products", item.id), {
        stock: increment(-item.qty)
      });
    }

    alert("✅ Sale completed!");
    cart = [];
    updateCart();

  } catch(e) {
    alert("Error: " + e.message);
  }
}
</script>
</body>
</html>
