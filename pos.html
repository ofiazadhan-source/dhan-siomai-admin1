
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - DHAN SIOMAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {background:#f5f5f5; padding:15px;}
.header {display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;}
.header h1 {font-size:20px; color:#ff6b35;}
.card {background:white; padding:15px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:15px;}
input, button {width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd; font-size:14px;}
button {background:#ff6b35; color:white; border:none; font-weight:700; cursor:pointer;}
button:hover {background:#e55a2b;}
.btn-secondary {background:#666;}
.btn-add-stock {background:#4caf50; padding:6px 12px; font-size:12px; width:auto; margin-right:5px;}
.btn-remove-stock {background:#f44336; padding:6px 12px; font-size:12px; width:auto;}
.product-row {display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #eee;}
.product-info h4 {margin-bottom:4px; font-size:15px;}
.product-info p {font-size:13px; color:#666;}
.product-actions {display:flex; gap:5px;}
.modal {display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;}
.modal.show {display:flex;}
.modal-content {background:white; padding:20px; border-radius:12px; max-width:350px; width:90%;}
.modal-content label {font-size:13px; color:#666; display:block; margin-bottom:5px;}
</style>
</head>
<body>

<div class="header">
  <h1>📦 Products</h1>
  <a href="index.html" style="color:#ff6b35; text-decoration:none; font-weight:600;">← Back</a>
</div>

<div class="card">
  <h3 style="margin-bottom:12px;">Add New Product</h3>
  <input type="text" id="prodName" placeholder="Product Name">
  <input type="number" id="prodPrice" placeholder="Price">
  <input type="number" id="prodStock" placeholder="Initial Stock">
  <button onclick="addProduct()">Add Product</button>
</div>

<div class="card">
  <h3 style="margin-bottom:12px;">Product List</h3>
  <div id="productList">Loading...</div>
</div>

<!-- Stock Adjustment Modal -->
<div class="modal" id="stockModal">
  <div class="modal-content">
    <h3 style="margin-bottom:10px;" id="modalTitle">Adjust Stock</h3>
    <p id="modalProductName" style="margin-bottom:10px; color:#666;"></p>
    <label>Quantity:</label>
    <input type="number" id="adjustStockQty" placeholder="Enter quantity" inputmode="numeric">
    <label id="reasonLabel" style="display:none;">Reason:</label>
    <input type="text" id="adjustReason" placeholder="e.g. New delivery, Damaged, Free" style="display:none;">
    <button id="modalConfirmBtn" onclick="confirmAdjustStock()">Confirm</button>
    <button class="btn-secondary" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from './firebase-config.js';

let currentProductId = null;
let adjustType = 'add';

onSnapshot(collection(db, "products"), (snapshot) => {
  const list = document.getElementById("productList");
  if(snapshot.empty) {
    list.innerHTML = "No products yet";
    return;
  }
  
  list.innerHTML = '';
  snapshot.forEach(docSnap => {
    const p = docSnap.data();
    list.innerHTML += `
      <div class="product-row">
        <div class="product-info">
          <h4>${p.name}</h4>
          <p>Price: ₱${p.price} | Stock: <strong>${p.stock || 0}</strong></p>
        </div>
        <div class="product-actions">
          <button class="btn-add-stock" onclick="openStockModal('${docSnap.id}', '${p.name}', 'add', ${p.stock || 0})">+ Add</button>
          <button class="btn-remove-stock" onclick="openStockModal('${docSnap.id}', '${p.name}', 'remove', ${p.stock || 0})">- Remove</button>
        </div>
      </div>
    `;
  });
});

window.addProduct = async function() {
  const name = document.getElementById('prodName').value.trim();
  const price = parseFloat(document.getElementById('prodPrice').value);
  const stock = parseInt(document.getElementById('prodStock').value) || 0;
  
  if(!name || !price) {
    alert("Fill up name and price boss");
    return;
  }
  
  try {
    await addDoc(collection(db, "products"), {
      name: name,
      price: price,
      stock: stock
    });
    
    document.getElementById('prodName').value = '';
    document.getElementById('prodPrice').value = '';
    document.getElementById('prodStock').value = '';
    alert("Product added!");
  } catch(e) {
    alert("Error: " + e.message);
  }
}

window.openStockModal = function(id, name, type, currentStock) {
  currentProductId = id;
  adjustType = type;
  
  document.getElementById('modalTitle').textContent = type === 'add' ? 'Add Stock' : 'Remove Stock';
  document.getElementById('modalProductName').textContent = `${name} - Current Stock: ${currentStock}`;
  document.getElementById('adjustStockQty').value = '';
  document.getElementById('adjustReason').value = '';
  
  // Show reason field only for remove
  if(type === 'remove') {
    document.getElementById('reasonLabel').style.display = 'block';
    document.getElementById('adjustReason').style.display = 'block';
  } else {
    document.getElementById('reasonLabel').style.display = 'none';
    document.getElementById('adjustReason').style.display = 'none';
  }
  
  document.getElementById('stockModal').classList.add('show');
}

window.closeModal = function() {
  document.getElementById('stockModal').classList.remove('show');
  currentProductId = null;
}

window.confirmAdjustStock = async function() {
  const qty = parseInt(document.getElementById('adjustStockQty').value);
  const reason = document.getElementById('adjustReason').value.trim();
  
  if(!qty || qty <= 0) {
    alert("Enter valid quantity boss");
    return;
  }
  
  if(adjustType === 'remove' && !reason) {
    alert("Lagay mo reason boss. Bakit binabawas?");
    return;
  }
  
  try {
    const productRef = doc(db, "products", currentProductId);
    
    if(adjustType === 'add') {
      await updateDoc(productRef, {
        stock: increment(qty)
      });
      alert(`Added ${qty} stock successfully!`);
    } else {
      // Check if enough stock
      const productSnap = await getDoc(productRef);
      const currentStock = productSnap.data().stock || 0;
      
      if(currentStock < qty) {
        alert("Hindi pwede! Kulang sa stock. Current: " + currentStock);
        return;
      }
      
      await updateDoc(productRef, {
        stock: increment(-qty)
      });
      
      // Save adjustment log - optional, pero maganda for tracking
      await addDoc(collection(db, "stockAdjustments"), {
        productId: currentProductId,
        productName: productSnap.data().name,
        type: 'remove',
        qty: qty,
        reason: reason,
        date: new Date()
      });
      
      alert(`Removed ${qty} stock. Reason: ${reason}`);
    }
    
    closeModal();
  } catch(e) {
    alert("Error: " + e.message);
  }
}

// Add getDoc import
import { getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
</script>
</body>
</html>
