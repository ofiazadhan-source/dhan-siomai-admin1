
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses - DHAN SIOMAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {background:#f5f5f5; padding:20px;}
.header {display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.header h1 {font-size:22px; color:#ff6b35;}
.container {max-width:800px; margin:0 auto;}
.card {background:white; padding:25px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:20px;}
.form-grid {display:grid; grid-template-columns: 2fr 1fr 1fr; gap:15px;}
input, select {width:100%; padding:12px; border-radius:8px; border:1px solid #ddd; font-family:'Poppins'; font-size:14px;}
.btn {padding:12px 20px; background:#ff6b35; color:white; border:none; border-radius:8px; font-weight:700; cursor:pointer;}
.btn:hover {background:#e55a2b;}
.btn-danger {background:#f44336;}
table {width:100%; border-collapse:collapse;}
th, td {padding:12px; text-align:left; border-bottom:1px solid #eee;}
th {background:#f8f8f8; font-weight:700;}
.total-box {background:#ff6b35; color:white; padding:15px; border-radius:8px; text-align:center; font-size:18px; font-weight:700;}
@media (max-width:768px) {.form-grid {grid-template-columns: 1fr;}}
</style>
</head>
<body>

<div class="header">
  <h1>💸 Expenses</h1>
  <a href="index.html" style="color:#ff6b35; text-decoration:none; font-weight:600;">← Back</a>
</div>

<div class="container">
  <div class="card">
    <h3 style="margin-bottom:15px;">Add Expense</h3>
    <div class="form-grid">
      <input type="text" id="desc" placeholder="Description e.g. Gas, Supplies">
      <input type="number" id="amount" placeholder="Amount">
      <select id="category">
        <option value="Supplies">Supplies</option>
        <option value="Utilities">Utilities</option>
        <option value="Transport">Transport</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <button class="btn" onclick="addExpense()" style="margin-top:15px;">Add Expense</button>
  </div>

  <div class="card">
    <div class="total-box">
      Total Expenses This Month: ₱<span id="totalMonth">0</span>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:15px;">Recent Expenses</h3>
    <table>
      <thead>
        <tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th></th></tr>
      </thead>
      <tbody id="expenseTable">
        <tr><td colspan="5">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
import { db } from './firebase-config.js';
import { collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const expensesRef = collection(db, "expenses");

// Load expenses
onSnapshot(query(expensesRef, orderBy("date", "desc")), (snapshot) => {
  const tbody = document.getElementById("expenseTable");
  let total = 0;
  
  if(snapshot.empty) {
    tbody.innerHTML = '<tr><td colspan="5">No expenses yet</td></tr>';
    document.getElementById("totalMonth").textContent = 0;
    return;
  }
  
  tbody.innerHTML = '';
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  
  snapshot.forEach(docSnap => {
    const e = docSnap.data();
    const date = e.date?.toDate ? e.date.toDate() : new Date();
    
    tbody.innerHTML += `
      <tr>
        <td>${date.toLocaleDateString()}</td>
        <td>${e.desc}</td>
        <td>${e.category}</td>
        <td>₱${e.amount}</td>
        <td><button class="btn-danger" style="padding:5px 10px; border:none; border-radius:6px; cursor:pointer;" onclick="deleteExpense('${docSnap.id}')">Delete</button></td>
      </tr>
    `;
    
    if(date >= monthStart) total += e.amount;
  });
  
  document.getElementById("totalMonth").textContent = total;
});

window.addExpense = async function() {
  const desc = document.getElementById("desc").value.trim();
  const amount = parseFloat(document.getElementById("amount").value);
  const category = document.getElementById("category").value;
  
  if(!desc || isNaN(amount)) {
    alert("Fill up description and amount boss");
    return;
  }
  
  await addDoc(expensesRef, {
    desc, amount, category,
    date: new Date()
  });
  
  document.getElementById("desc").value = "";
  document.getElementById("amount").value = "";
  alert("Expense added!");
}

window.deleteExpense = async function(id) {
  if(confirm("Delete this expense boss?")) {
    await deleteDoc(doc(db, "expenses", id));
  }
}
</script>
</body>
</html>
