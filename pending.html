<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pending Payments - Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {background:#FFF8E1;}
.header {background:linear-gradient(135deg, #D32F2F, #B71C1C); color:white; padding:15px; display:flex; justify-content:space-between; align-items:center;}
.container {padding:15px; max-width:1100px; margin:0 auto;}
.card {
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 3px 8px rgba(0,0,0,0.1);
  border-left:4px solid #FFC107;
}
</style>
</head>
<body>
<div class="header">
  <h1>⏳ Pending Payments</h1>
  <a href="index.html" style="color:white;text-decoration:none;">← Back</a>
</div>

<div class="container">
  <div id="pendingList">Loading...</div>
</div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyDk3ZbOXuw3PEfJzdt8AI2ueJq5yksfekE",
authDomain: "dhan-siomai-pos-fe1e5.firebaseapp.com",
projectId: "dhan-siomai-pos-fe1e5",
storageBucket: "dhan-siomai-pos-fe1e5.firebasestorage.app",
messagingSenderId: "305932123173",
appId: "1:305932123173:web:f27894a2d5e6e6ab8253cc"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

db.collection("dhan-sales").where("status", "==", "Pending")
  .orderBy("timestamp", "desc")
  .onSnapshot(snap => {
    const list = document.getElementById("pendingList");
    if(snap.empty) {
      list.innerHTML = '<p style="text-align:center;padding:40px;">No pending payments</p>';
      return;
    }

    list.innerHTML = '';
    snap.forEach(doc => {
      const o = doc.data();
      list.innerHTML += `
      <div class="card">
        <strong>${o.customerName}</strong><br>
        <div style="font-size:13px;color:#666;">
          ${o.customerPhone}<br>
          ₱${o.total} - ${o.method}<br>
          ${o.timestamp?.toDate().toLocaleString() || ''}
        </div>
        <button onclick="window.location.href='online-store.html'" 
          style="margin-top:10px;padding:8px 16px;background:#D32F2F;color:white;border:none;border-radius:8px;">
          View Details
        </button>
      </div>`;
    });
  });
</script>
</body>
</html>
