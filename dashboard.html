<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - DHAN SIOMAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {background:#f5f5f5; min-height:100vh;}
.header {background: linear-gradient(135deg, #ff6b35, #ff8c65); color:white; padding:15px; display:flex; justify-content:space-between; align-items:center; border-radius:0 0 20px 20px;}
.header h1 { font-size:18px; font-weight:700; }
.header a { color:#ff6b35; background:#fff; text-decoration:none; font-weight:600; padding:8px 14px; border-radius:8px; }
.container {padding:15px;}
.card {background:white; padding:18px; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,0.08); margin-bottom:15px;}
.card h3 {margin-bottom:12px; color:#333; font-size:16px;}
input[type="date"] {width:100%; padding:12px; border:2px solid #ddd; border-radius:10px; font-size:16px; margin-bottom:12px;}
.btn {width:100%; padding:14px; background:#ff6b35; color:white; border:none; border-radius:12px; font-weight:700; font-size:16px; cursor:pointer;}
.stats-grid {display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:15px;}
.stat-card {background:white; padding:15px 10px; border-radius:12px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.stat-card label {font-size:12px; color:#666; display:block; margin-bottom:5px;}
.stat-card .value {font-size:18px; font-weight:700; color:#ff6b35;}
.detail-item {padding:12px 0; border-bottom:1px solid #eee;}
.detail-item:last-child {border-bottom:none;}
.detail-item .row {display:flex; justify-content:space-between; align-items:flex-start;}
.detail-item small {color:#666; font-size:12px;}
.proof-img {max-width:100%; max-height:200px; border-radius:8px; margin-top:8px; border:2px solid #0077ff; cursor:pointer;}
.no-data {text-align:center; color:#999; padding:20px 0;}
.loading {text-align:center; color:#ff6b35; padding:20px 0;}
.badge {display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600; color:white;}
.badge-cash {background:#4caf50;}
.badge-gcash {background:#2196f3;}
</style>
</head>
<body>

<div class="header">
  <h1>📊 Dashboard</h1>
  <a href="index.html">← Back</a>
</div>

<div class="container">
  <div class="card">
    <h3>Select Date</h3>
    <input type="date" id="datePicker">
    <button class="btn" onclick="loadReport()">View Report</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <label>Total Sales</label>
      <div class="value" id="totalSales">₱0</div>
    </div>
    <div class="stat-card">
      <label>Total Expenses</label>
      <div class="value" id="totalExpenses">₱0</div>
    </div>
    <div class="stat-card">
      <label>Net Profit</label>
      <div class="value" id="netProfit">₱0</div>
    </div>
  </div>

  <div class="card">
    <h3>Sales Details</h3>
    <div id="salesDetails"><div class="no-data">No sales</div></div>
  </div>

  <div class="card">
    <h3>Expenses Details</h3>
    <div id="expensesDetails"><div class="no-data">No expenses</div></div>
  </div>
</div>

<script type="module">
import { collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db } from './firebase-config.js';

// Set today's date
document.getElementById('datePicker').valueAsDate = new Date();

window.loadReport = async function() {
  const dateStr = document.getElementById('datePicker').value;
  if(!dateStr) {
    alert('Please select a date');
    return;
  }

  document.getElementById('salesDetails').innerHTML = '<div class="loading">Loading...</div>';
  document.getElementById('expensesDetails').innerHTML = '<div class="loading">Loading...</div>';

  const [year, month, day] = dateStr.split('-').map(Number);
  const startDate = new Date(year, month - 1, day, 0, 0, 0, 0);
  const endDate = new Date(year, month - 1, day, 23, 59, 59, 999);

  let totalSales = 0;
  let totalExpenses = 0;
  let salesHTML = '';
  let expensesHTML = '';

  try {
    // Load Sales
    const salesQuery = query(
      collection(db, "sales"),
      where("date", ">=", startDate),
      where("date", "<=", endDate),
      orderBy("date", "desc")
    );
    const salesSnap = await getDocs(salesQuery);

    if(salesSnap.empty) {
      salesHTML = '<div class="no-data">No sales</div>';
    } else {
      salesSnap.forEach(doc => {
        const sale = doc.data();
        const saleDate = sale.date.toDate();
        totalSales += sale.total;
        
        const time = saleDate.toLocaleTimeString('en-PH', {hour:'2-digit', minute:'2-digit'});
        const badgeClass = sale.paymentMethod === 'GCash' ? 'badge-gcash' : 'badge-cash';
        
        let itemsList = '';
        if(sale.items) {
          itemsList = sale.items.map(i => `${i.name} x${i.qty}`).join(', ');
        }
        
        salesHTML += `
          <div class="detail-item">
            <div class="row">
              <div style="flex:1;">
                <span class="badge ${badgeClass}">${sale.paymentMethod}</span>
                <div style="margin-top:5px; font-size:13px;">${itemsList}</div>
                <small>${time}</small>
              </div>
              <strong style="font-size:16px; color:#ff6b35;">₱${sale.total}</strong>
            </div>
            ${sale.proofOfPayment ? `<img src="${sale.proofOfPayment}" class="proof-img" onclick="window.open('${sale.proofOfPayment}', '_blank')">` : ''}
          </div>
        `;
      });
    }

    // Load Expenses - FIXED: use desc not note
    const expensesQuery = query(
      collection(db, "expenses"),
      where("date", ">=", startDate),
      where("date", "<=", endDate),
      orderBy("date", "desc")
    );
    const expensesSnap = await getDocs(expensesQuery);

    if(expensesSnap.empty) {
      expensesHTML = '<div class="no-data">No expenses</div>';
    } else {
      expensesSnap.forEach(doc => {
        const exp = doc.data();
        const expDate = exp.date.toDate();
        totalExpenses += exp.amount;
        
        const time = expDate.toLocaleTimeString('en-PH', {hour:'2-digit', minute:'2-digit'});
        expensesHTML += `
          <div class="detail-item">
            <div class="row">
              <div>
                <strong>${exp.category}</strong><br>
                <small>${exp.desc || 'No description'} • ${time}</small>
              </div>
              <strong style="color:#e63946;">-₱${exp.amount}</strong>
            </div>
          </div>
        `;
      });
    }

    // Update UI
    document.getElementById('totalSales').textContent = `₱${totalSales.toLocaleString()}`;
    document.getElementById('totalExpenses').textContent = `₱${totalExpenses.toLocaleString()}`;
    document.getElementById('netProfit').textContent = `₱${(totalSales - totalExpenses).toLocaleString()}`;
    document.getElementById('salesDetails').innerHTML = salesHTML;
    document.getElementById('expensesDetails').innerHTML = expensesHTML;

  } catch(error) {
    console.error('Error:', error);
    alert('Error: ' + error.message);
    document.getElementById('salesDetails').innerHTML = '<div class="no-data">Error loading data</div>';
    document.getElementById('expensesDetails').innerHTML = '<div class="no-data">Error loading data</div>';
  }
}

window.addEventListener('load', () => {
  loadReport();
});
</script>
</body>
</html>
