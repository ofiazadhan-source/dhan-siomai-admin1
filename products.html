<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - DHAN SIOMAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {background:#f5f5f5; padding:20px;}
.header {display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.header h1 {font-size:22px; color:#ff6b35;}
.container {max-width:900px; margin:0 auto;}
.form-card, .table-card {background:white; padding:25px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:20px;}
.form-grid {display:grid; grid-template-columns: 1fr 1fr 1fr; gap:15px;}
input {width:100%; padding:12px; border-radius:8px; border:1px solid #ddd; font-family:'Poppins'; font-size:14px;}
.btn {padding:12px 20px; background:#ff6b35; color:white; border:none; border-radius:8px; font-weight:700; cursor:pointer; font-size:14px;}
.btn:hover {background:#e55a2b;}
.btn-danger {background:#f44336;}
.btn-danger:hover {background:#d32f2f;}
.btn-secondary {background:#666;}
table {width:100%; border-collapse:collapse;}
th, td {padding:12px; text-align:left; border-bottom:1px solid #eee;}
th {background:#f8f8f8; font-weight:700;}
.action-btn {padding:6px 12px; margin-right:5px; border:none; border-radius:6px; cursor:pointer; font-size:13px;}
@media (max-width:768px) {
  .form-grid {grid-template-columns: 1fr;}
  table {font-size:14px;}
}
</style>
</head>
<body>

<div class="header">
  <h1>📦 Manage Products</h1>
  <a href="index.html" style="color:#ff6b35; text-decoration:none; font-weight:600;">← Back</a>
</div>

<div class="container">
  <!-- Add/Edit Form -->
  <div class="form-card">
    <h3 id="formTitle" style="margin-bottom:15px;">Add Product</h3>
    <div class="form-grid">
      <input type="text" id="name" placeholder="Product Name">
      <input type="number" id="price" placeholder="Price">
      <input type="number" id="stock" placeholder="Stock">
    </div>
    <div style="margin-top:15px;">
      <button class="btn" id="saveBtn" onclick="saveProduct()">Save Product</button>
      <button class="btn btn-secondary" id="cancelBtn" onclick="cancelEdit()" style="display:none;">Cancel</button>
    </div>
  </div>

  <!-- Products Table -->
  <div class="table-card">
    <h3 style="margin-bottom:15px;">Product List</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="productTable">
        <tr><td colspan="4">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
import { db } from './firebase-config.js';
import { collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let editingId = null;
const productsRef = collection(db, "products");

// Real-time load products
onSnapshot(productsRef, (snapshot) => {
  const tbody = document.getElementById("productTable");
  if(snapshot.empty) {
    tbody.innerHTML = '<tr><td colspan="4">No products yet</td></tr>';
    return;
  }
  
  tbody.innerHTML = '';
  snapshot.forEach(docSnap => {
    const p = docSnap.data();
    tbody.innerHTML += `
      <tr>
        <td>${p.name}</td>
        <td>₱${p.price}</td>
        <td>${p.stock || 0}</td>
        <td>
          <button class="action-btn" style="background:#ff6b35; color:white;" onclick="editProduct('${docSnap.id}')">Edit</button>
          <button class="action-btn btn-danger" onclick="deleteProduct('${docSnap.id}')">Delete</button>
        </td>
      </tr>
    `;
  });
});

window.saveProduct = async function() {
  const name = document.getElementById("name").value.trim();
  const price = parseFloat(document.getElementById("price").value);
  const stock = parseInt(document.getElementById("stock").value) || 0;
  
  if(!name || isNaN(price)) {
    alert("Fill up name and price boss");
    return;
  }
  
  try {
    if(editingId) {
      await updateDoc(doc(db, "products", editingId), {name, price, stock});
      alert("Product updated!");
    } else {
      await addDoc(productsRef, {name, price, stock, createdAt: new Date()});
      alert("Product added!");
    }
    cancelEdit();
  } catch(e) {
    alert("Error: " + e.message);
  }
}

window.editProduct = async function(id) {
  const docSnap = await getDoc(doc(db, "products", id));
  if(docSnap.exists()) {
    const p = docSnap.data();
    document.getElementById("name").value = p.name;
    document.getElementById("price").value = p.price;
    document.getElementById("stock").value = p.stock;
    editingId = id;
    document.getElementById("formTitle").textContent = "Edit Product";
    document.getElementById("saveBtn").textContent = "Update Product";
    document.getElementById("cancelBtn").style.display = "inline-block";
  }
}

window.deleteProduct = async function(id) {
  if(confirm("Delete this product boss?")) {
    await deleteDoc(doc(db, "products", id));
    alert("Product deleted");
  }
}

window.cancelEdit = function() {
  editingId = null;
  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("stock").value = "";
  document.getElementById("formTitle").textContent = "Add Product";
  document.getElementById("saveBtn").textContent = "Save Product";
  document.getElementById("cancelBtn").style.display = "none";
}

// Import getDoc since ginamit sa edit
import { getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
</script>
</body>
</html>
