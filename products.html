<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - DHAN SIOMAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif;}
body {background:linear-gradient(135deg, #fff5f0, #ffe8dd);}
.header {
  background: linear-gradient(135deg, #ff6b35, #ff8c65);
  color:white; padding:15px; display:flex; justify-content:space-between; align-items:center;
  box-shadow:0 4px 12px rgba(255,107,53,0.3);
}
.header h1 { font-size: 18px; font-weight:700; }
.header a { color:#ff6b35; background:#fff; text-decoration:none; font-weight:600; padding:8px 14px; border-radius:8px; }

.container {padding:15px;}
.card {background:white; padding:18px; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,0.08); margin-bottom:15px;}

input, button, select {width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:2px solid #ffd4c2; font-size:14px;}
input:focus {outline:none; border-color:#ff6b35;}
button {background:linear-gradient(135deg, #ff6b35, #ff8c65); color:white; border:none; font-weight:700; cursor:pointer; transition:0.2s;}
button:active {transform:scale(0.98);}

.btn-add-stock {background:linear-gradient(135deg, #4caf50, #66bb6a); padding:8px 14px; font-size:12px; width:auto;}
.btn-remove-stock {background:linear-gradient(135deg, #f44336, #ef5350); padding:8px 14px; font-size:12px; width:auto;}

.product-grid {display:grid; gap:12px;}
.product-card {
  background:white; border-radius:14px; padding:12px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
  border-left:4px solid #ff6b35;
}
.product-img {
  width:100%; height:120px; object-fit:cover; border-radius:10px; margin-bottom:8px;
  background:#ffe8dd;
}
.product-info h4 {margin-bottom:4px; font-size:16px; color:#333;}
.product-info p {font-size:13px; color:#666; margin-bottom:8px;}
.product-actions {display:flex; gap:6px; align-items:center; margin-top:8px;}
.qty-input {width:70px!important; padding:8px!important; margin:0!important;}

.file-input {
  padding:8px; background:#fff5f0; border:2px dashed #ff6b35; text-align:center;
}
</style>
</head>
<body>
<div class="header">
  <h1>📦 Products</h1>
  <a href="index.html">← Back</a>
</div>

<div class="container">
  <div class="card">
    <h3 style="margin-bottom:12px; color:#ff6b35;">➕ Add New Product</h3>
    <input type="text" id="prodName" placeholder="Product Name">
    <input type="number" id="prodPrice" placeholder="Price">
    <input type="number" id="prodStock" placeholder="Initial Stock">
    <input type="file" id="prodImage" accept="image/*" class="file-input">
    <button onclick="addProduct()">Add Product</button>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px; color:#ff6b35;">📋 Product List</h3>
    <div id="productList" class="product-grid">Loading...</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, increment, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import { db } from './firebase-config.js';
import { storage } from './firebase-config.js';

// Display products
onSnapshot(collection(db, "products"), (snapshot) => {
  const list = document.getElementById("productList");
  if(snapshot.empty) {
    list.innerHTML = "<p style='text-align:center; color:#999;'>No products yet</p>";
    return;
  }

  list.innerHTML = '';
  snapshot.forEach(docSnap => {
    const p = docSnap.data();
    const imgUrl = p.imageUrl || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgZmlsbD0iI2ZmZThkZCIvPjx0ZXh0IHg9IjYwIiB5PSI2MCIgZm9udC1zaXplPSIxNCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZmNmIzNSI+Tm8gSW1hZ2U8L3RleHQ+PC9zdmc+';

    list.innerHTML += `
      <div class="product-card">
        <img src="${imgUrl}" class="product-img" alt="${p.name}">
        <div class="product-info">
          <h4>${p.name}</h4>
          <p>₱${p.price} | Stock: <strong style="color:#ff6b35;">${p.stock || 0}</strong></p>
        </div>
        <div class="product-actions">
          <input type="number" id="qty-${docSnap.id}" placeholder="Qty" class="qty-input" inputmode="numeric" min="1">
          <button class="btn-add-stock" onclick="quickAdjust('${docSnap.id}', 'add')">+ Add</button>
          <button class="btn-remove-stock" onclick="quickAdjust('${docSnap.id}', 'remove')">- Remove</button>
        </div>
      </div>
    `;
  });
});

// Quick add/remove stock
window.quickAdjust = async function(id, type) {
  const qtyInput = document.getElementById(`qty-${id}`);
  const qty = parseInt(qtyInput.value);

  if(!qty || qty <= 0) {
    alert("Lagay mo muna quantity boss");
    return;
  }

  const productRef = doc(db, "products", id);

  try {
    if(type === 'add') {
      await updateDoc(productRef, { stock: increment(qty) });
      alert(`✅ Added ${qty} stock!`);
      qtyInput.value = '';
    } else {
      const snap = await getDoc(productRef);
      const currentStock = snap.data().stock || 0;

      if(currentStock < qty) {
        alert(`❌ Kulang sa stock. Current: ${currentStock}`);
        return;
      }

      const reason = prompt("Reason for removing stock:");
      if(!reason) return;

      await updateDoc(productRef, { stock: increment(-qty) });
      await addDoc(collection(db, "stockAdjustments"), {
        productId: id,
        productName: snap.data().name,
        type: 'remove',
        qty: qty,
        reason: reason,
        date: new Date()
      });
      alert(`✅ Removed ${qty} stock`);
      qtyInput.value = '';
    }
  } catch(e) {
    alert("Error: " + e.message);
  }
}

// Add product with image upload
window.addProduct = async function() {
  const name = document.getElementById('prodName').value.trim();
  const price = parseFloat(document.getElementById('prodPrice').value);
  const stock = parseInt(document.getElementById('prodStock').value) || 0;
  const file = document.getElementById('prodImage').files[0];

  if(!name ||!price) {
    alert("Fill up name and price boss");
    return;
  }

  let imageUrl = '';

  try {
    // Upload image to Firebase Storage if meron
    if(file) {
      const storageRef = ref(storage, `products/${Date.now()}_${file.name}`);
      const snapshot = await uploadBytes(storageRef, file);
      imageUrl = await getDownloadURL(snapshot.ref);
    }

    // Check for duplicate
    let existingProduct = null;
    const snapshot = await getDocs(collection(db, "products"));
    snapshot.forEach(docSnap => {
      if(docSnap.data().name.toLowerCase() === name.toLowerCase()) {
        existingProduct = {id: docSnap.id};
      }
    });

    if(existingProduct) {
      await updateDoc(doc(db, "products", existingProduct.id), {
        stock: increment(stock),
        imageUrl: imageUrl || docSnap.data().imageUrl
      });
      alert(`✅ ${name} updated! Added ${stock} to existing stock.`);
    } else {
      await addDoc(collection(db, "products"), { name, price, stock, imageUrl });
      alert("✅ Product added!");
    }

    document.getElementById('prodName').value = '';
    document.getElementById('prodPrice').value = '';
    document.getElementById('prodStock').value = '';
    document.getElementById('prodImage').value = '';

  } catch(e) {
    alert("Error: " + e.message);
  }
}
</script>
</body>
</html>
